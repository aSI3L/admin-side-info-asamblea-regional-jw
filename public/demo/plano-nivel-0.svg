<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" font-family="Arial, sans-serif">
  <rect width="800" height="800" fill="#f4f1ea"/>
  <rect x="40" y="40" width="720" height="720" fill="#fff" stroke="#3a3a3a" stroke-width="8"/>
  <!-- Pasillo principal -->
  <rect x="120" y="520" width="600" height="80" fill="#e6e1d6"/>
  <rect x="610" y="240" width="80" height="360" fill="#e6e1d6"/>
  <!-- Hall de entrada -->
  <rect x="320" y="600" width="160" height="160" fill="#efe9dc" stroke="#3a3a3a" stroke-width="4"/>
  <rect x="370" y="752" width="60" height="16" fill="#fff"/>
  <text x="400" y="690" font-size="20" text-anchor="middle" fill="#333">Hall</text>
  <!-- Baños -->
  <rect x="120" y="300" width="160" height="200" fill="#dbe9f4" stroke="#3a3a3a" stroke-width="4"/>
  <rect x="180" y="496" width="40" height="10" fill="#fff"/>
  <text x="200" y="390" font-size="20" text-anchor="middle" fill="#333">Baños</text>
  <!-- Informes -->
  <rect x="320" y="360" width="160" height="140" fill="#f6e6c8" stroke="#3a3a3a" stroke-width="4"/>
  <rect x="380" y="496" width="40" height="10" fill="#fff"/>
  <text x="400" y="420" font-size="20" text-anchor="middle" fill="#333">Informes</text>
  <!-- Escalera -->
  <rect x="580" y="120" width="140" height="120" fill="#e0d6f0" stroke="#3a3a3a" stroke-width="4"/>
  <g stroke="#7a6a99" stroke-width="3">
    <line x1="590" y1="140" x2="710" y2="140"/><line x1="590" y1="160" x2="710" y2="160"/>
    <line x1="590" y1="180" x2="710" y2="180"/><line x1="590" y1="200" x2="710" y2="200"/>
  </g>
  <text x="650" y="230" font-size="18" text-anchor="middle" fill="#333">Escalera</text>
  <text x="400" y="90" font-size="28" font-weight="bold" text-anchor="middle" fill="#555">PLANTA BAJA (Nivel 0)</text>
</svg>
