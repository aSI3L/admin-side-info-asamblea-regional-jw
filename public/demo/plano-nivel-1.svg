<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" font-family="Arial, sans-serif">
  <rect width="800" height="800" fill="#f4f1ea"/>
  <rect x="40" y="40" width="720" height="720" fill="#fff" stroke="#3a3a3a" stroke-width="8"/>
  <!-- Pasillos -->
  <rect x="380" y="260" width="320" height="80" fill="#e6e1d6"/>
  <rect x="460" y="260" width="80" height="360" fill="#e6e1d6"/>
  <rect x="380" y="540" width="340" height="80" fill="#e6e1d6"/>
  <!-- Auditorio -->
  <rect x="80" y="120" width="300" height="320" fill="#d9eed9" stroke="#3a3a3a" stroke-width="4"/>
  <rect x="372" y="280" width="16" height="40" fill="#fff"/>
  <text x="230" y="290" font-size="24" text-anchor="middle" fill="#333">Auditorio</text>
  <!-- Cafetería -->
  <rect x="80" y="480" width="300" height="220" fill="#f6dccb" stroke="#3a3a3a" stroke-width="4"/>
  <rect x="372" y="560" width="16" height="40" fill="#fff"/>
  <text x="230" y="600" font-size="24" text-anchor="middle" fill="#333">Cafetería</text>
  <!-- Primeros auxilios -->
  <rect x="600" y="640" width="140" height="100" fill="#f4d6d6" stroke="#3a3a3a" stroke-width="4"/>
  <rect x="660" y="632" width="40" height="16" fill="#fff"/>
  <text x="670" y="700" font-size="16" text-anchor="middle" fill="#333">Primeros auxilios</text>
  <!-- Escalera -->
  <rect x="580" y="120" width="140" height="120" fill="#e0d6f0" stroke="#3a3a3a" stroke-width="4"/>
  <g stroke="#7a6a99" stroke-width="3">
    <line x1="590" y1="140" x2="710" y2="140"/><line x1="590" y1="160" x2="710" y2="160"/>
    <line x1="590" y1="180" x2="710" y2="180"/><line x1="590" y1="200" x2="710" y2="200"/>
  </g>
  <text x="650" y="230" font-size="18" text-anchor="middle" fill="#333">Escalera</text>
  <text x="400" y="90" font-size="28" font-weight="bold" text-anchor="middle" fill="#555">PRIMER PISO (Nivel 1)</text>
</svg>
